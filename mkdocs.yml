# Generated by scripts/build_site.py — do not edit by hand.
site_name: Project Zomboid Knowledge Base (B41 & B42)
site_description: Evidence-based, source-cited Project Zomboid reference for modders, players, server admins and creators — every document version-tagged for Build 41 (legacy41) and Build 42.
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
nav:
  - Home: index.md
  - "Class 1 — Track foundations (Modders / Players / Admins / Creator)":
      - "Running a Project Zomboid Dedicated Server: Architecture, Branches and Hosting Choices": admins/admins-foundation.md
      - "The Project Zomboid Content Landscape: Formats, Channels and the B42-Stable Window": creator/creator-foundation.md
      - "The Knox Event and the History of Project Zomboid's Builds": lore/lore-foundation.md
      - "How This Knowledge Base Is Written: Genre, Build Tags and License Rules": meta/meta-style-guide.md
      - "Modding Project Zomboid: Ecosystem, Toolchain and Where the API Truth Lives": modders/modders-foundation.md
      - "Surviving Knox Country: The Core Game Across Build 41 and Build 42": players/players-foundation.md
